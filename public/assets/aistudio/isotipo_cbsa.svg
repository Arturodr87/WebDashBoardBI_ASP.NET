         C 37 2, 54 2, 58 6
         C 70 7, 75 16, 74.5 24
         L 74.5 51.5
         L 17 51.5
         Z"
      fill="#FFFFFF"
    />

    <!-- Foam Scalloped Navy Outline -->
    <path
      d="M 17 24 
         C 16.2 16, 21.5 6.5, 33 6
         C 37.5 1.8, 53.5 1.8, 58 6
         C 69.5 6.5, 74.8 16, 74.5 24"
      fill="none"
      stroke="#00306B"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Letter "m" in Deep Navy -->
    <!-- Left stem -->
    <path
      d="M 17 24
         H 27.5
         V 49
         H 17
         Z"
      fill="#00306B"
    />
    <!-- Center stem and arches of m -->
    <path
      d="M 27.5 24
         Q 33.5 24 33.5 27
         V 49
         H 44.5
         V 27
         Q 44.5 24 50.5 24
         H 61
         V 49
         H 50.5
         V 31
         Q 50.5 29 48 29
         Q 45.5 29 45.5 31
         V 49
         H 33.5
         V 31
         Q 33.5 29 31 29
         Q 28.5 29 28.5 31
         V 49
         H 17"
      fill="#00306B"
    />

    <!-- Letter "i" in Deep Navy -->
    <rect
      x="65"
      y="24"
      width="9.5"
      height="25"
      rx="0.5"
      fill="#00306B"
    />

    <!-- Golden Beer Lower Glass -->
    <path
      d="M 17 51.5
         H 74.5
         V 71
         C 74.5 83, 62 89, 45.75 89
         C 29.5 89, 17 83, 17 71
         Z"
