<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 91 90" width="100%" height="100%">
  <!-- Definition / Mask if needed -->
  <defs>
    <filter id="cbsa-subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#001838" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#cbsa-subtle-glow)">
    <!-- White Foam Fill (behind the navy outline) -->
    <path
      d="M 17 24 
